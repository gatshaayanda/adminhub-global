name: BoardSignal First Review Hotfix PWA Build V15

on:
  push:
    branches:
      - boardsignal-hotfix-first-review-completion-ux-runner-v15

permissions:
  contents: write

jobs:
  finish-validation-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out isolated hotfix branch
        uses: actions/checkout@v4
        with:
          ref: boardsignal-hotfix-first-review-completion-ux
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore exact seven-file validated implementation
        shell: bash
        run: |
          git fetch origin boardsignal-hotfix-first-review-completion-ux-runner-v7
          python - <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output(["git","show","origin/boardsignal-hotfix-first-review-completion-ux-runner-v7:.github/workflows/first-review-hotfix-runner-v7.yml"], text=True)
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          exec(compile(textwrap.dedent(source[start:end]), "<v7-hotfix-implementation>", "exec"))
          PY

      - name: Normalize stale PWA assertions to immutable baseline behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/boardsignal-pwa-offline.test.cjs')
          text = p.read_text()
          replacements = [
            (r'  assert.match(register, /registration\?\.waiting/); // 41', r'  assert.match(register, /registration\.waiting/); // 41'),
            (r'  assert.match(register, /reloadedRef\.current/); // 45', r'  assert.match(register, /reloadForUpdateRef\.current/); // 45'),
            (r'  assert.match(register, /Your current session will not reload by itself/); // 46', r'  assert.match(register, /Your current screen will not reload on its own/); // 46'),
            (r'  assert.match(offlineRoom, /Offline • showing your saved BoardSignal from/); // 63', r"  assert.match(offlineRoom, /You're offline\. Showing your saved BoardSignal from/); // 63"),
            (r'  assert.match(offlineRoom, /New Chess\.com games, Pulse movement, messages and account changes will appear after you reconnect/); // 64', r'  assert.match(offlineRoom, /New Chess\.com games, Pulse movement, messages and account changes are not included after/); // 64'),
            (r'  assert.match(offlineRoom, /Latest four active Desks/); // 65', r'  assert.match(offlineRoom, /Latest four saved Reviews/); // 65'),
            (r'  assert.match(offlineRoom, /UNIVERSE · OFFLINE SNAPSHOT/); // 69', r'  assert.match(offlineRoom, /UNIVERSE · SAVED/); // 69'),
            (r'  assert.match(offlineRoom, /No new episode analysis runs offline/); // 73', r'  assert.match(offlineRoom, /no new analysis runs offline/); // 73'),
            (r'  assert.match(room, /Reconnect before generating or publishing a Desk/);', r'  assert.match(room, /Reconnect before finishing or saving a review/);'),
            (r'  assert.match(friends, /const load = useCallback[\s\S]*\}, \[token\]\)/); // 86', r'  assert.match(friends, /const load = useCallback[\s\S]*\}, \[messageTarget, token\]\)/); // 86'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one stale PWA assertion, found {count}: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: PWA suite
        run: |
          mkdir -p validation-logs
          set -o pipefail
          npm run test:pwa 2>&1 | tee validation-logs/08-pwa.log

      - name: Contrast suite
        run: |
          set -o pipefail
          npm run test:contrast 2>&1 | tee validation-logs/09-contrast.log

      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee validation-logs/10-build.log

      - name: Restore temporary PWA regression compatibility edit
        run: git checkout -- tests/boardsignal-pwa-offline.test.cjs

      - name: Confirm exact seven-file hotfix delta and untouched historical onboarding
        shell: bash
        run: |
          git diff --exit-code HEAD -- src/components/BoardSignalHistoryWorker.tsx
          printf '%s\n' \
            src/app/api/boardsignal/engine-diagnostic/route.ts \
            src/components/BoardSignalPlayerRoom.tsx \
            src/components/UniversalPlayerDesk.tsx \
            src/lib/boardsignal/client/engineDiagnosticReporter.ts \
            src/lib/boardsignal/engineDiagnostics.ts \
            tests/boardsignal-engine-diagnostics.test.ts \
            tests/boardsignal-first-review-completion-ux-hotfix.test.cjs | sort > /tmp/expected-files
          git diff --name-only HEAD | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Upload finishing validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-review-hotfix-finish-v15
          path: validation-logs/
          if-no-files-found: warn

      - name: Commit and push hotfix branch only
        run: |
          git config user.name "BoardSignal Hotfix Runner"
          git config user.email "boardsignal-hotfix@users.noreply.github.com"
          git add src/components/BoardSignalPlayerRoom.tsx src/components/UniversalPlayerDesk.tsx src/lib/boardsignal/engineDiagnostics.ts src/lib/boardsignal/client/engineDiagnosticReporter.ts src/app/api/boardsignal/engine-diagnostic/route.ts tests/boardsignal-engine-diagnostics.test.ts tests/boardsignal-first-review-completion-ux-hotfix.test.cjs
          git commit -m "Fix first Review completion experience"
          git push origin HEAD:boardsignal-hotfix-first-review-completion-ux
