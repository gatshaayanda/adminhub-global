name: BoardSignal Patch J CJS diagnostic

on:
  push:
    branches:
      - patch-j-guarded-20260827

permissions:
  contents: write

jobs:
  diagnose-cjs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASELINE_SHA: 8a3b80f8a45ab82b3a2a73d6241d08b615d0cd1a
      TARGET_BRANCH: boardsignal-v10
      TRANSFORMER: .patch-j/apply_patch_j.py
    steps:
      - name: Checkout guarded staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline and apply Patch J
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          live_sha="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$live_sha" = "$BASELINE_SHA" || { echo "PATCH_J_BASELINE_MOVED expected=$BASELINE_SHA actual=$live_sha"; exit 42; }
          cp "$TRANSFORMER" /tmp/apply_patch_j.py
          git checkout --detach "$BASELINE_SHA"
          python3 /tmp/apply_patch_j.py
          git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run CJS files individually and capture results
        shell: bash
        run: |
          set +e
          : > /tmp/patch-j-cjs-files.log
          overall=0
          count=0
          for f in tests/boardsignal-*.test.cjs; do
            count=$((count + 1))
            echo "=== $f ===" | tee -a /tmp/patch-j-cjs-files.log
            node --test "$f" >> /tmp/patch-j-cjs-files.log 2>&1
            status=$?
            echo "EXIT=$status" | tee -a /tmp/patch-j-cjs-files.log
            if [ "$status" -ne 0 ]; then
              overall=$status
            fi
          done
          echo "FILES=$count OVERALL=$overall" | tee -a /tmp/patch-j-cjs-files.log
          cat /tmp/patch-j-cjs-files.log
          mkdir -p .patch-j
          cp /tmp/patch-j-cjs-files.log .patch-j/cjs-file-results.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .patch-j/cjs-file-results.log
          git commit -m "Capture Patch J per-file CJS diagnostics" || true
          git push origin "HEAD:refs/heads/diagnostic/patch-j-cjs-files-${GITHUB_RUN_ID}"
          exit "$overall"
