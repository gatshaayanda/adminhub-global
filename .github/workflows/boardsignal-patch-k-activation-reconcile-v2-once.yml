name: BoardSignal Patch K Activation Reconcile V2 Once

on:
  push:
    branches:
      - boardsignal-patch-k-instant-access-growth
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-activation-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Patch K
        uses: actions/checkout@v4
        with:
          ref: boardsignal-patch-k-instant-access-growth
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run corrected reconciliation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/boardsignal-patch-k-activation-reconcile-once.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          old = 'text, count = pattern.subn(replacement.rstrip() + "\\n", text, count=1)'
          new = 'text, count = pattern.subn(lambda _match: replacement.rstrip() + "\\n", text, count=1)'
          if old not in script:
              raise SystemExit('expected reconciliation subn line missing')
          script = script.replace(old, new, 1)
          exec(compile(script, '<patch-k-activation-reconcile>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate reconciled activation suite
        run: npm run test:activation

      - name: Check activation patch formatting
        run: git diff --check -- tests/boardsignal-activation-bridge.test.cjs

      - name: Commit reconciled activation guard
        shell: bash
        run: |
          if git diff --quiet -- tests/boardsignal-activation-bridge.test.cjs; then
            echo "Activation assertions already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/boardsignal-activation-bridge.test.cjs
          git commit -m "Reconcile Patch K activation regressions"
          git push origin HEAD:boardsignal-patch-k-instant-access-growth
