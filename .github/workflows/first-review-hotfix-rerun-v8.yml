name: BoardSignal First Review Hotfix Gate Rerun V8

on:
  push:
    branches:
      - boardsignal-hotfix-first-review-completion-ux-runner-v8

permissions:
  contents: read

jobs:
  exact-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated hotfix branch
        uses: actions/checkout@v4
        with:
          ref: boardsignal-hotfix-first-review-completion-ux
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore exact seven-file V7 implementation
        shell: bash
        run: |
          git fetch origin boardsignal-hotfix-first-review-completion-ux-runner-v7
          python - <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output([
              "git", "show",
              "origin/boardsignal-hotfix-first-review-completion-ux-runner-v7:.github/workflows/first-review-hotfix-runner-v7.yml"
          ], text=True)
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          body = textwrap.dedent(source[start:end])
          exec(compile(body, "<v7-hotfix-implementation>", "exec"))
          PY

      - name: Exact existing first-review and history regression gate
        id: exact_gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/boardsignal-first-review-onboarding-loop-hotfix.test.cjs tests/boardsignal-durable-first-desk-resilience.test.cjs tests/boardsignal-active-week-next-game-guidance.test.cjs tests/boardsignal-player-room-g3.test.cjs 2>&1 | tee exact-first-review-history-gate.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload exact gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-first-review-history-gate-v8
          path: exact-first-review-history-gate.log
          if-no-files-found: error

      - name: Preserve exact gate result
        if: always()
        shell: bash
        run: |
          test "${{ steps.exact_gate.outputs.exit_code }}" = "0"
