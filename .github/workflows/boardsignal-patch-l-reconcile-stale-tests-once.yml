name: BoardSignal Patch L Stale Test Reconciler

on:
  push:
    branches:
      - boardsignal-patch-l-product-experience

permissions:
  contents: write

jobs:
  reconcile-once:
    if: github.event.head_commit.message == 'Trigger Patch L stale test reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boardsignal-patch-l-product-experience
          fetch-depth: 0
      - name: Reconcile stale pre-L regression expectations
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one stale block in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "tests/boardsignal-beta-access.test.ts",
              '''test("public username to LIVE Desk remains available without authentication", () => {
            const buildPage = readFileSync("src/app/boardsignal/build/[handle]/page.tsx", "utf8");
            const usernameForm = readFileSync("src/components/UsernameDeskForm.tsx", "utf8");
            const liveRoute = readFileSync("src/app/api/boardsignal/[username]/route.ts", "utf8");
            assert.match(buildPage, /UniversalPlayerDesk/);
            assert.match(usernameForm, /onSubmit=\\{submit\\}/);
            assert.match(usernameForm, /name="username"/);
            assert.match(usernameForm, /event\\.preventDefault\\(\\)/);
            assert.match(usernameForm, /const cleanUsername = username\\.trim\\(\\)/);
            assert.match(liveRoute, /buildLiveDesk/);
            assert.doesNotMatch(liveRoute, /requirePlayerToken/);
          });'''.replace("          ", ""),
              '''test("public LIVE Desk compatibility remains without turning username search into an access path", () => {
            const buildPage = readFileSync("src/app/boardsignal/build/[handle]/page.tsx", "utf8");
            const homepage = readFileSync("src/app/page.tsx", "utf8");
            const usernameForm = readFileSync("src/components/UsernameDeskForm.tsx", "utf8");
            const liveRoute = readFileSync("src/app/api/boardsignal/[username]/route.ts", "utf8");
            assert.match(buildPage, /UniversalPlayerDesk/);
            assert.match(homepage, /EXPLORE THE UNIVERSE/);
            assert.doesNotMatch(usernameForm, /public-universe-username-form|onSubmit=\\{submit\\}/);
            assert.match(usernameForm, /action: "return"/);
            assert.match(usernameForm, /Now connect your Chess\\.com profile/);
            assert.match(liveRoute, /buildLiveDesk/);
            assert.doesNotMatch(liveRoute, /requirePlayerToken/);
          });'''.replace("          ", ""),
          )

          replace_once(
              "tests/boardsignal-communications-onboarding.test.ts",
              '''test("5. required Universe participation is disclosed and cannot be falsely toggled off", () => {
            const form = read("src/components/UsernameDeskForm.tsx");
            const gate = read("src/components/BetaAgreementGate.tsx");
            const profile = read("src/components/PlayerProfileNotifications.tsx");
            assert.match(form, /className="beta-universe-disclosure"/);
            assert.match(form, /SEE YOUR GAMES TOGETHER/);
            assert.match(gate, /Included with Founding Access/);
            assert.match(profile, /Public highlights/);
            assert.match(profile, /Google Access never unlocks public Chess.com identity by itself/);
            assert.match(profile, /privacy: \\{ \\.\\.\\.privacy, publicPlayerPage: true, universeCoverage: true \\}/);
            assert.doesNotMatch(profile, /Allow safe positive Universe coverage/);
          });'''.replace("          ", ""),
              '''test("5. required Universe participation is disclosed without competing with Google-first access", () => {
            const homepage = read("src/app/page.tsx");
            const gate = read("src/components/BetaAgreementGate.tsx");
            const profile = read("src/components/PlayerProfileNotifications.tsx");
            assert.match(homepage, /THE BOARDSIGNAL UNIVERSE/);
            assert.match(homepage, /Public highlights\\. Private improvement guidance/);
            assert.match(gate, /Included with Founding Access/);
            assert.match(profile, /Public highlights/);
            assert.match(profile, /Google Access never unlocks public Chess.com identity by itself/);
            assert.match(profile, /privacy: \\{ \\.\\.\\.privacy, publicPlayerPage: true, universeCoverage: true \\}/);
            assert.doesNotMatch(profile, /Allow safe positive Universe coverage/);
          });'''.replace("          ", ""),
          )

          replace_once(
              "tests/boardsignal-patch-h.test.ts",
              '''test("G.3 Player Room integration stays presentation-safe", () => {
            const page = read("src/app/boardsignal/player-room/page.tsx");
            const room = read("src/components/BoardSignalPlayerRoom.tsx");
            const quickRead = read("src/components/PlayerRoomQuickRead.tsx");
            const worker = read("src/components/BoardSignalHistoryWorker.tsx");
            assert.match(page, /BoardSignalPlayerRoom/);
            assert.match(page, /BoardSignalHistoryWorker/);
            assert.match(quickRead, /YOUR WEEK IN 20 SECONDS/);
            assert.match(room, /presentationMode="player-room"/);'''.replace("          ", ""),
              '''test("G.3 Player Room integration stays presentation-safe", () => {
            const page = read("src/app/boardsignal/player-room/page.tsx");
            const gate = read("src/components/BoardSignalPlayerRoomGate.tsx");
            const room = read("src/components/BoardSignalPlayerRoom.tsx");
            const quickRead = read("src/components/PlayerRoomQuickRead.tsx");
            const worker = read("src/components/BoardSignalHistoryWorker.tsx");
            assert.match(page, /BoardSignalPlayerRoomGate/);
            assert.match(gate, /BoardSignalPlayerRoom/);
            assert.match(gate, /BoardSignalHistoryWorker/);
            assert.match(quickRead, /YOUR WEEK IN 20 SECONDS/);
            assert.match(room, /presentationMode="player-room"/);'''.replace("          ", ""),
          )
      - name: Verify only regression expectations changed
        run: |
          git diff --check
          git diff -- tests/boardsignal-beta-access.test.ts tests/boardsignal-communications-onboarding.test.ts tests/boardsignal-patch-h.test.ts
      - name: Commit reconciled expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/boardsignal-beta-access.test.ts tests/boardsignal-communications-onboarding.test.ts tests/boardsignal-patch-h.test.ts
          git commit -m "Reconcile Patch L stale access regressions"
          git push origin HEAD:boardsignal-patch-l-product-experience
