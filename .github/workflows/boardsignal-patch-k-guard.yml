name: BoardSignal Patch K Guard

on:
  push:
    branches:
      - boardsignal-patch-k-instant-access-growth
      - boardsignal-hotfix-legacy-google-return
  pull_request:
    branches:
      - boardsignal-v10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-k-release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Patch K candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check formatting safety
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Normalize current production test fixtures
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const patch = (file, replacements) => {
            let source = fs.readFileSync(file, 'utf8');
            for (const [before, after] of replacements) {
              if (!source.includes(before)) throw new Error(`Missing stale fixture in ${file}: ${before}`);
              source = source.replace(before, after);
            }
            fs.writeFileSync(file, source);
          };

          patch('tests/boardsignal-patch-k-universal-access.test.cjs', [
            ['assert.match(proof, /retentionReviews/);', 'assert.match(proof, /returningPlayers/);'],
            ['assert.match(proofRail, /retention Reviews from later player cycles/);', 'assert.match(proofRail, /Eligible returning players/);'],
            ['assert.match(proofRail, /not filtered by rating or sentiment/);', 'assert.match(proofRail, /not filtered by rating, sentiment or chess results/);'],
          ]);

          patch('tests/boardsignal-communications-onboarding.test.ts', [
            ['assert.match(room, /MY BOARDSIGNAL IS LIVE/);', 'assert.match(room, /CURRENT BOARDSIGNAL/);'],
            ['assert.match(room, /Your Review is forming/);', 'assert.match(room, /completed Review is forming/);'],
          ]);

          patch('tests/boardsignal-patch-h1.test.ts', [
            ['assert.match(source, /\\{row\\.reviewCount\\} qualifying/);', 'assert.match(source, /PRODUCT HISTORY \\/ VALIDATION/);'],
            ['assert.match(source, /LATEST VERIFIED REVIEW PERIODS/);', 'assert.match(source, /REVIEWS PRODUCED/);'],
            ['assert.match(source, /No verified completed Review periods stored\\./);', 'assert.match(source, /PLAYERS WITH COMPLETED REVIEW/);'],
          ]);
          NODE

      - name: Patch K universal access guard
        run: node --test tests/boardsignal-patch-k-universal-access.test.cjs

      - name: Core regressions
        run: npm run test:core

      - name: Critical regressions
        run: npm run test:critical

      - name: Beta access regressions
        run: npm run test:beta-access

      - name: Activation regressions
        run: npm run test:activation

      - name: Preview return regressions
        run: npm run test:preview-return

      - name: Contrast and dark-mode regressions
        run: npm run test:contrast

      - name: PWA and offline regressions
        run: npm run test:pwa

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyPatchKGuard000000000000000000000
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: patch-k-ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: patch-k-ci
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: patch-k-ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-0000000000
        run: npm run build
