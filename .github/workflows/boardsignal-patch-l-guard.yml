name: BoardSignal Patch L Guard

on:
  push:
    branches:
      - boardsignal-patch-l-experience-system-universe-engagement
  pull_request:
    branches:
      - boardsignal-v10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-l-release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Patch L candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check formatting safety
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Patch L experience architecture guard
        run: node --test tests/boardsignal-patch-l-experience.test.cjs

      - name: Patch K universal access guard
        run: node --test tests/boardsignal-patch-k-universal-access.test.cjs

      - name: Core regressions
        run: npm run test:core

      - name: Critical regressions
        run: npm run test:critical

      - name: Beta access regressions
        run: npm run test:beta-access

      - name: Activation regressions
        run: npm run test:activation

      - name: Preview return regressions
        run: npm run test:preview-return

      - name: Universe regressions
        run: npm run test:universe-pulse

      - name: Ask BoardSignal regressions
        run: npm run test:ask

      - name: Delivery regressions
        run: npm run test:delivery

      - name: PWA and offline regressions
        run: npm run test:pwa

      - name: Active cascade contrast and state regressions
        run: npm run test:contrast

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Render onboarding in real Chrome at desktop and mobile widths
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyPatchLGuard000000000000000000000
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: patch-l-ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: patch-l-ci
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: patch-l-ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-0000000000
        run: |
          set -euo pipefail
          npm run dev -- -p 3100 > /tmp/boardsignal-patch-l-dev.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "http://127.0.0.1:3100/boardsignal/qa/onboarding?state=google&theme=light" >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/boardsignal-patch-l-dev.log
            exit 1
          fi
          node --experimental-websocket scripts/check-boardsignal-onboarding-render.mjs

      - name: Production build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyPatchLGuard000000000000000000000
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: patch-l-ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: patch-l-ci
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: patch-l-ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-0000000000
        run: npm run build
