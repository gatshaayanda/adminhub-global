name: Patch K final release validation

on:
  push:
    branches:
      - boardsignal-patch-k-instant-access-growth
    paths:
      - .github/workflows/patch-k-final-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout final candidate with baseline history
        uses: actions/checkout@v4
        with:
          ref: boardsignal-patch-k-instant-access-growth
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Patch K universal access guard
        run: node --test tests/boardsignal-patch-k-universal-access.test.cjs

      - name: Core regressions
        run: npm run test:core

      - name: Critical regressions
        run: npm run test:critical

      - name: Beta access regressions
        run: npm run test:beta-access

      - name: Activation regressions
        run: npm run test:activation

      - name: Preview return regressions
        run: npm run test:preview-return

      - name: Contrast and dark-mode regressions
        run: npm run test:contrast

      - name: PWA and offline regressions
        run: npm run test:pwa

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Seal successful validation and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-k-final-validation.yml
          git commit -m "Seal final Patch K release validation"
          git push origin HEAD:boardsignal-patch-k-instant-access-growth
