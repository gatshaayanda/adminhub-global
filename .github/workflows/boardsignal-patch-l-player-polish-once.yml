name: BoardSignal Patch L Player Polish

on:
  push:
    branches:
      - boardsignal-patch-l-product-experience

permissions:
  contents: write

jobs:
  polish-once:
    if: github.event.head_commit.message == 'Trigger Patch L player language and offline polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boardsignal-patch-l-product-experience
          fetch-depth: 0
      - name: Reconcile player-facing language and offline navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          room_path = Path("src/components/BoardSignalPlayerRoom.tsx")
          room = room_path.read_text()
          before = room
          room = room.replace('"THIS WEEK · PROVISIONAL"', '"THIS WEEK · FORMING"')
          room = room.replace('CURRENT WEEK · PROVISIONAL', 'CURRENT WEEK · FORMING')
          room = room.replace('? "PROVISIONAL" : "OFFICIAL"', '? "FORMING" : "OFFICIAL"')
          if room == before or "CURRENT WEEK · PROVISIONAL" in room or '"THIS WEEK · PROVISIONAL"' in room:
              raise SystemExit("Player Room provisional language was not reconciled exactly")
          room_path.write_text(room)

          offline_path = Path("src/components/OfflinePlayerRoom.tsx")
          offline = offline_path.read_text()
          offline = offline.replace(
              'type OfflineTab = "desk" | "progress" | "pulse" | "universe" | "friends";',
              'type OfflineTab = "desk" | "progress" | "universe" | "friends";',
          )
          offline = offline.replace(
              'New Chess.com games, Pulse movement, messages and account changes are not included',
              'New Chess.com games, Universe movement, messages and account changes are not included',
          )
          old_nav = '{(["desk","progress","pulse","universe","friends"] as OfflineTab[]).map((item) => <button type="button" key={item} className={tab===item?"active":""} onClick={() => setTab(item)} aria-current={tab===item?"page":undefined}>{item === "desk" ? "Review" : item === "progress" ? "Progress" : item === "pulse" ? "Pulse" : item === "universe" ? "Universe" : "Friends"}</button>)}'
          new_nav = '{(["desk","progress","universe","friends"] as OfflineTab[]).map((item) => <button type="button" key={item} className={tab===item?"active":""} onClick={() => setTab(item)} aria-current={tab===item?"page":undefined}>{item === "desk" ? "Review" : item === "progress" ? "Progress" : item === "universe" ? "Universe" : "Friends"}</button>)}'
          if old_nav not in offline:
              raise SystemExit("Offline legacy Pulse navigation was not found exactly")
          offline = offline.replace(old_nav, new_nav, 1)

          pulse_pattern = re.compile(r'\n    \{tab === "pulse" \? <div className="container player-room-memory"><section className="pulse-universe-block">.*?</section></div> : null\}\n', re.S)
          offline, removed = pulse_pattern.subn("\n", offline, count=1)
          if removed != 1:
              raise SystemExit(f"Expected one offline Pulse panel, removed {removed}")

          marker = '<span>Not live</span></div>{snapshot.pulse?.whatsHot?.length ?'
          movement = '<span>Not live</span></div>{snapshot.pulse ? <><h3>Since your last synchronization</h3><div className="offline-pulse-list">{snapshot.pulse.sinceAway ? <article><span>{snapshot.pulse.sinceAway.eyebrow}</span><h3>{snapshot.pulse.sinceAway.title}</h3><p>{snapshot.pulse.sinceAway.body}</p></article> : null}{[...snapshot.pulse.boardMoved,...snapshot.pulse.proximity,...snapshot.pulse.provisional].slice(0,8).map((item) => <article key={item.id}><span>{item.eyebrow} · {item.finality === "provisional" ? "forming" : "official"}</span><h3>{item.title}</h3><p>{item.body}</p></article>)}</div></> : null}{snapshot.pulse?.whatsHot?.length ?'
          if marker not in offline:
              raise SystemExit("Offline Universe insertion point missing")
          offline = offline.replace(marker, movement, 1)
          if '"pulse" | "universe"' in offline or '>Pulse<' in offline or 'PULSE · LAST SYNCHRONIZED' in offline:
              raise SystemExit("Player-facing offline Pulse destination still present")
          offline_path.write_text(offline)

          comm_path = Path("tests/boardsignal-communications-onboarding.test.ts")
          comm = comm_path.read_text()
          comm = comm.replace('assert.equal((header.match(/Get My BoardSignal/g) ?? []).length, 2);', 'assert.equal((header.match(/Open BoardSignal/g) ?? []).length, 2);')
          comm = comm.replace('assert.match(screens, /Get My BoardSignal|Player Room|COMMUNICATIONS|COVERAGE/);', 'assert.match(screens, /Open BoardSignal|My BoardSignal|COMMUNICATIONS|COVERAGE/);')
          comm_path.write_text(comm)
      - name: Verify Patch L player cleanup
        run: |
          git diff --check
          grep -q 'CURRENT WEEK · FORMING' src/components/BoardSignalPlayerRoom.tsx
          ! grep -q 'CURRENT WEEK · PROVISIONAL' src/components/BoardSignalPlayerRoom.tsx
          ! grep -q 'PULSE · LAST SYNCHRONIZED' src/components/OfflinePlayerRoom.tsx
          grep -q 'Universe movement' src/components/OfflinePlayerRoom.tsx
      - name: Remove one-shot reconciliation workflows
        run: |
          git rm .github/workflows/boardsignal-patch-l-player-polish-once.yml
          git rm .github/workflows/boardsignal-patch-l-reconcile-stale-tests-once.yml
      - name: Commit player product polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BoardSignalPlayerRoom.tsx src/components/OfflinePlayerRoom.tsx tests/boardsignal-communications-onboarding.test.ts
          git commit -m "Polish Patch L player language and offline Universe"
          git push origin HEAD:boardsignal-patch-l-product-experience
