name: BoardSignal PWA Baseline Compare V14

on:
  push:
    branches:
      - boardsignal-hotfix-first-review-completion-ux-runner-v14

permissions:
  contents: read

jobs:
  pwa-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable production baseline
        uses: actions/checkout@v4
        with:
          ref: 2d528c38cd7441324cf98b472fb77db5def640c7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run exact PWA gate on baseline
        id: pwa
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:pwa 2>&1 | tee pwa-baseline.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload PWA baseline output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-baseline-v14
          path: pwa-baseline.log
          if-no-files-found: error
      - name: Preserve PWA result
        if: always()
        run: test "${{ steps.pwa.outputs.exit_code }}" = "0"
