name: BoardSignal Patch K Reconcile Once

on:
  push:
    branches:
      - boardsignal-patch-k-instant-access-growth
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Patch K branch
        uses: actions/checkout@v4
        with:
          ref: boardsignal-patch-k-instant-access-growth
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply final Patch K product reconciliation
        run: node scripts/patch-k-final-reconcile.mjs

      - name: Commit Google-first Player Room agreement compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/BoardSignalPlayerRoom.tsx')
          s = p.read_text()
          old = 'if (!hasAcceptedCurrentBetaAgreement(snapshot.account)) return <>{snapshot.originalBetaReturn ? <OriginalBetaWelcome /> : null}<BetaAgreementGate onAccept={acceptAgreement} /></>;'
          new = 'if (!snapshot.account.googleAccessConnectedAt && !hasAcceptedCurrentBetaAgreement(snapshot.account)) return <>{snapshot.originalBetaReturn ? <OriginalBetaWelcome /> : null}<BetaAgreementGate onAccept={acceptAgreement} /></>;'
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s:
              raise SystemExit('Google-first agreement compatibility target was not reconciled')
          p.write_text(s)
          PY

      - name: Reconcile Patch K product assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/boardsignal-patch-k-universal-access.test.cjs')
          s = p.read_text()
          old = 'assert.doesNotMatch(usernameForm, /PREVIEW|FOUNDER REVIEW|WAITING FOR APPROVAL|CONTINUE WITHOUT GOOGLE/i);'
          new = 'assert.doesNotMatch(usernameForm, /BOARD SIGNAL PREVIEW|CONTINUE PREVIEW|FOUNDER REVIEW|WAITING FOR APPROVAL|CONTINUE WITHOUT GOOGLE/i);'
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s:
              raise SystemExit('Normal-onboarding compatibility assertion was not reconciled')
          p.write_text(s)
          PY

      - name: Apply intended legacy compatibility correction
        run: node scripts/patch-k-legacy-compat-reconcile.mjs

      - name: Commit permanently reconciled product and tests
        run: |
          git diff --check
          git status --short
          git config user.name "boardsignal-patch-k-bot"
          git config user.email "actions@users.noreply.github.com"
          git add AGENTS.md BOARD_SIGNAL_PRODUCT_CONTRACT.md src/components/BoardSignalPlayerRoom.tsx src/components/PlayerProfileNotifications.tsx src/components/UsernameDeskForm.tsx tests/boardsignal-activation-bridge.test.cjs tests/boardsignal-beta-access.test.ts tests/boardsignal-communications-onboarding.test.ts tests/boardsignal-patch-k-universal-access.test.cjs
          if git diff --cached --quiet; then
            echo "Reconciled product state is already committed."
            exit 0
          fi
          git commit -m "Commit Patch K final reconciled product state"
          git push origin HEAD:boardsignal-patch-k-instant-access-growth
