name: BoardSignal First Review Baseline Gate V9

on:
  push:
    branches:
      - boardsignal-hotfix-first-review-completion-ux-runner-v9

permissions:
  contents: read

jobs:
  baseline-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable production baseline
        uses: actions/checkout@v4
        with:
          ref: 2d528c38cd7441324cf98b472fb77db5def640c7
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact existing first-review and history regression gate on baseline
        id: exact_gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/boardsignal-first-review-onboarding-loop-hotfix.test.cjs tests/boardsignal-durable-first-desk-resilience.test.cjs tests/boardsignal-active-week-next-game-guidance.test.cjs tests/boardsignal-player-room-g3.test.cjs 2>&1 | tee exact-first-review-history-baseline-gate.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload baseline gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-first-review-history-baseline-gate-v9
          path: exact-first-review-history-baseline-gate.log
          if-no-files-found: error

      - name: Preserve exact baseline gate result
        if: always()
        shell: bash
        run: |
          test "${{ steps.exact_gate.outputs.exit_code }}" = "0"
