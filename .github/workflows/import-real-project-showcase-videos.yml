name: Import real project showcase videos

on:
  push:
    branches:
      - chore/import-real-project-showcase-videos

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Import source videos
        env:
          PUREPRESS_URL: https://purepress-omega.vercel.app
        run: |
          node <<'NODE'
          (async () => {
          const fs = require('fs');
          const { chromium } = require('playwright');

          const seeds = [
            process.env.PUREPRESS_URL + '/',
            process.env.PUREPRESS_URL + '/gallery',
            process.env.PUREPRESS_URL + '/home',
            process.env.PUREPRESS_URL + '/app',
            process.env.PUREPRESS_URL + '/feed',
            process.env.PUREPRESS_URL + '/about',
            process.env.PUREPRESS_URL + '/blog',
            process.env.PUREPRESS_URL + '/deals',
            process.env.PUREPRESS_URL + '/how-it-works',
            process.env.PUREPRESS_URL + '/room-styles',
            process.env.PUREPRESS_URL + '/join',
            process.env.PUREPRESS_URL + '/pricing',
            process.env.PUREPRESS_URL + '/claims',
            process.env.PUREPRESS_URL + '/connect',
            process.env.PUREPRESS_URL + '/contact',
          ];

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const queue = [...seeds];
          const seen = new Set();
          let found = null;

          while (queue.length && seen.size < 40 && !found) {
            const url = queue.shift();
            if (seen.has(url)) continue;
            seen.add(url);

            try {
              await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
              await page.waitForTimeout(2500);

              const result = await page.evaluate(() => {
                const text = document.body?.innerText || '';
                const videos = Array.from(document.querySelectorAll('video')).map((video) => ({
                  src: video.currentSrc || video.src || '',
                  nearby: (video.closest('article,section,div')?.innerText || '').slice(0, 1000),
                })).filter((item) => item.src);

                const links = Array.from(document.querySelectorAll('a[href]'))
                  .map((a) => a.href)
                  .filter((href) => href.startsWith(location.origin));

                return { text, videos, links };
              });

              const normalized = result.text.toLowerCase();
              if (normalized.includes('undead clowns')) {
                console.log('FOUND UNDEAD CLOWNS ON', url);
                console.log('VIDEOS', JSON.stringify(result.videos));
                const candidate = result.videos.find((item) => /^https?:/i.test(item.src));
                if (candidate) found = { pageUrl: url, ...candidate };
              }

              for (const link of result.links) {
                if (!seen.has(link) && queue.length < 60) queue.push(link);
              }
            } catch (error) {
              console.log('SKIP', url, error.message);
            }
          }

          if (!found) {
            throw new Error('Could not locate the approved PurePress video near the Undead Clowns section.');
          }

          console.log('SELECTED PUREPRESS VIDEO', JSON.stringify(found));

          const response = await fetch(found.src);
          if (!response.ok) throw new Error(`Video download failed: ${response.status}`);
          const buffer = Buffer.from(await response.arrayBuffer());

          if (buffer.length < 100000) {
            throw new Error(`Selected PurePress video is unexpectedly small: ${buffer.length} bytes`);
          }

          fs.mkdirSync('public/video/projects', { recursive: true });
          fs.writeFileSync('public/video/projects/purepress-team.mp4', buffer);

          await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

          curl -L --fail --retry 3 \
            -o public/video/projects/namane-tyre-work.mp4 \
            https://raw.githubusercontent.com/gatshaayanda/namane-tyres/main/public/namane-assets/zoom-in-work-on-tyres.mp4

      - name: Wire showcase mappings
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/ProjectShowcase.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const namaneOld = '{number:"04",title:"Namane Tyres",type:"Customer booking & work progress",href:"https://namane-tyres.vercel.app/",status:"CLIENT WORK · ACTIVE",statusTone:"active",summary:"A roadside tyre business system connecting customer requests, booking and work progress.",}';
          const namaneNew = '{number:"04",title:"Namane Tyres",type:"Customer booking & work progress",href:"https://namane-tyres.vercel.app/",status:"CLIENT WORK · ACTIVE",statusTone:"active",summary:"A roadside tyre business system connecting customer requests, booking and work progress.",video:"/video/projects/namane-tyre-work.mp4"}';

          const purepressOld = '{number:"02",title:"PurePress",type:"Business application",href:"https://purepress-omega.vercel.app/",status:"CLIENT WORK · FOLLOW-UP",statusTone:"followup",summary:"A business application developed for a real operating workflow, with further client engagement to follow.",}';
          const purepressNew = '{number:"02",title:"PurePress",type:"Business application",href:"https://purepress-omega.vercel.app/",status:"CLIENT WORK · FOLLOW-UP",statusTone:"followup",summary:"A business application developed for a real operating workflow, with further client engagement to follow.",video:"/video/projects/purepress-team.mp4"}';

          if (!source.includes(namaneOld)) throw new Error('Namane mapping did not match expected current source.');
          if (!source.includes(purepressOld)) throw new Error('PurePress mapping did not match expected current source.');

          source = source.replace(namaneOld, namaneNew).replace(purepressOld, purepressNew);
          fs.writeFileSync(path, source);
          NODE

      - name: Verify imported assets
        run: |
          test -s public/video/projects/namane-tyre-work.mp4
          test -s public/video/projects/purepress-team.mp4
          file public/video/projects/namane-tyre-work.mp4
          file public/video/projects/purepress-team.mp4
          grep -F 'video:"/video/projects/namane-tyre-work.mp4"' src/components/ProjectShowcase.tsx
          grep -F 'video:"/video/projects/purepress-team.mp4"' src/components/ProjectShowcase.tsx

      - name: Commit imported assets and mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-real-project-showcase-videos.yml
          git add public/video/projects/namane-tyre-work.mp4 public/video/projects/purepress-team.mp4 src/components/ProjectShowcase.tsx
          git commit -m "feat: add real PurePress and Namane showcase videos"
          git push origin HEAD:chore/import-real-project-showcase-videos
